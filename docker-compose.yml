# Local Kafka for Baze: one broker (KRaft mode, no ZooKeeper) plus a
# one-shot job that creates the sensor-events topic.
#
#   docker compose up -d
#
# Edge (bridge.py) and backend connect to localhost:9092.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: baze-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # Clients on the host use localhost:9092; containers use kafka:29092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly below, so a typo can't make a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Events carry a base64 camera frame, so allow messages up to 5 MB.
      KAFKA_MESSAGE_MAX_BYTES: 5242880
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic baze.sensor-events
        --partitions 3 --replication-factor 1
        --config retention.ms=604800000
        --config max.message.bytes=5242880 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --describe --topic baze.sensor-events
    restart: "no"
